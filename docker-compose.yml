services:
  opencode:
    build:
      context: ./opencode
      dockerfile: Dockerfile
    container_name: kitchen-opencode
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?OPENCODE_API_KEY is required}
    expose:
      - "4096"

  kitchen-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kitchen-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/kitchen.db
      OPENCODE_SERVER_URL: http://opencode:4096
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENCODE_SERVER_HOSTNAME: 0.0.0.0
      OPENCODE_SERVER_PORT: 4096
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
    depends_on:
      - opencode
