services:
  kitchen-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kitchen-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/kitchen.db
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENCODE_SERVER_HOSTNAME: 127.0.0.1
      OPENCODE_SERVER_PORT: 4096
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
