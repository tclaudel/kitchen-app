name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  security:
    name: Security gates
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

  deploy:
    name: Deploy to VPS
    needs: security
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 145.239.64.235 >> ~/.ssh/known_hosts

      - name: Sync project
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='uploads/' \
            -e 'ssh -i ~/.ssh/vps_key' \
            ./ tclaudel@145.239.64.235:/home/tclaudel/kitchen-app/

      - name: Build and restart
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        run: |
          ssh -i ~/.ssh/vps_key tclaudel@145.239.64.235 \
            "mkdir -p /home/tclaudel/kitchen-app/data /home/tclaudel/kitchen-app/uploads && \
             printf 'OPENCODE_SERVER_PASSWORD=%s\n' '$OPENCODE_SERVER_PASSWORD' > /home/tclaudel/kitchen-app/.env && \
             cd /home/tclaudel/kitchen-app && docker compose down --remove-orphans && docker compose up -d --build"
