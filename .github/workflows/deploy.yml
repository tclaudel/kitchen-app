name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  security:
    name: Security gates
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

  publish:
    name: Publish container
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6.15.0
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production image
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require deployment target configuration
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "Configure the production environment secret DEPLOY_COMMAND with the command that deploys the GHCR image."
            exit 1
          fi

      - name: Deploy image
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: eval "$DEPLOY_COMMAND"
